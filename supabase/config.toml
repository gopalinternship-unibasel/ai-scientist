# Local self-hosted Supabase stack for AI Scientist.
#
# The original hosted Lovable Cloud project (hdutcpduikzrrlisbker) no longer
# exists. This file now drives a local stack started with `supabase start`
# (see RUNNING.md). Ports follow the cv-project-fixes port plan so this stack
# can run next to the other projects on the same machine.
project_id = "ai-research-assistant"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329

# Migrations are applied by scripts/start-local.ps1 (`supabase migration up`)
# right after supabase/local-bootstrap.sql, because two original migrations
# need a role grant that only the local superuser can give. Auto-apply on
# `supabase start` would run them before that grant and fail.
[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local mail catcher (Mailpit): sign-up confirmation and password-reset
# emails land here instead of being sent.
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5180"
additional_redirect_urls = [
  "http://localhost:5180",
  "http://localhost:5180/my-runs",
  "http://localhost:5180/reset-password",
  "http://127.0.0.1:5180",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enabled = true
double_confirm_changes = true
# Local testing: no confirmation email needed before the first sign-in.
enable_confirmations = false
max_frequency = "1s"

[edge_runtime]
enabled = true
# per_worker keeps one warm worker per function, which is what
# `supabase functions serve` uses for hot reload.
policy = "per_worker"
inspector_port = 8083
deno_version = 2

# Analytics (Logflare + Vector) is off: on Windows it needs the Docker daemon
# exposed on tcp://localhost:2375. Edge-function logs are read with
# `docker logs supabase_edge_runtime_ai-research-assistant` instead.
[analytics]
enabled = false
port = 54327
backend = "postgres"

# Edge functions. The browser calls run-experiment and embed-feedback
# anonymously (anon key only), so they opt out of JWT verification and
# authorise inside the function. distill-house-rules and eval-harness keep the
# default (JWT required) and additionally check for a moderator/admin role.
[functions.run-experiment]
verify_jwt = false

[functions.embed-feedback]
verify_jwt = false

[functions.backfill-feedback-embeddings]
verify_jwt = false
