name: Pages

# Builds the frontend for the project site and publishes it with the GitHub
# Pages actions. The build reads the public Supabase values from repository
# variables (Settings, Secrets and variables, Actions, Variables). While they
# are not set, the workflow ends with a notice and publishes nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  config:
    name: Check settings
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
        run: |
          if [ -n "$URL" ] && [ -n "$KEY" ] && [ -n "$PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not published: set the repository variables VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY and VITE_SUPABASE_PROJECT_ID first (see Live deployment in RUNNING.md)."
          fi

  build:
    name: Build
    needs: config
    if: needs.config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
          VITE_BASE_PATH: /ai-scientist/
          VITE_HOSTED_DEMO: "true"

      # Pages answers unknown paths with 404.html. A copy of the app shell there
      # lets deep links such as /ai-scientist/runs/<id>?t=<token> load the app.
      - name: Add the deep-link fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
