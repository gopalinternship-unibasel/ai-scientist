name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint
        continue-on-error: true

      - name: Test
        run: bun run test   # Vitest (jsdom); `bun test` is Bun's own runner and cannot run these suites

      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
          VITE_SUPABASE_PROJECT_ID: placeholder

  edge-functions:
    name: Edge functions (Deno test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test shared logic
        run: deno test --allow-net --allow-env --allow-read supabase/functions/_shared/
        continue-on-error: true

      - name: Test run-experiment
        run: deno test --allow-net --allow-env --allow-read supabase/functions/run-experiment/
        continue-on-error: true
